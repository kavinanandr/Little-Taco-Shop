<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Taco Shop - Contact Us</title>
    <meta name="author" content="Kavin Anand">
    <meta name="description" content="Hours page of Little Taco Shop">
    <link rel="icon" href="img/icon.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>

            <div class="top">
                <h1>🌮 Little Taco Shop 🌮</h1>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="menu.html">Our Menu</a>
                    <a href="hours.html">Store Hours</a>
                    <a href="#contact">Contact Us</a>
                </nav>
            </div>
            <figure>
                    <img src="img/tacos_close_up_400x260.png" alt="delicious tacos" title="Delicious tacos!" width="400px" height="260px">
            </figure>
        </header>

        <main>
            <section id="contact">
                <h2>Our Location</h2>
                <br>
                <address>555 Taco Temptation Lane, Suite T <br>Kansas City. MO 55555-5555</address>
                <p>Phone: <a href="tel:555-555-5555">555-555-5555</a></p>
                <br><br>
                <h2>Our Contact Form</h2>
                <br>
                
                <form action="contact.html">
                    <label for="name">Name:</label>
                    <br>
                    <input type="text" name="name" id="name" placeholder="your name" required>
                    <br><br>

                    <label for="email">Email:</label>
                    <br>
                    <input type="email" name="email" id="email" placeholder="your email" required>
                    <br><br>

                    <label for="yourmessage">Your Message:</label>
                    <br>
                    <textarea name="yourmessage" id="youremessage" placeholder="Type your message here"></textarea>
                    <br><br><br>
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </form>
                <br>
                <p><a href="#">Back to top</a></p>
            </section>
        </main>

        <footer>Copyright &copy;The Little Taco Shop</footer>
    </div>  
</body>
</html>
