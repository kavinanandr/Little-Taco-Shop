<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Taco Shop - Menu</title>
    <link rel="icon" href="img/icon.jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="top">
            
                <h1>🌮 Little Taco Shop 🌮</h1>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="#menu">Our Menu</a>
                    <a href="hours.html">Store Hours</a>
                    <a href="contact.html">Contact Us</a>
                </nav>
            </div>
                <figure>
                    <img src="img/images.jpeg" alt="tacos" title="Tacos!" width="640" height="479">
                </figure>
        </header>
        
        <main>
            <section id="menu"">
                <h2>Our Menu</h2>
                <div class="table">
                    <table>
                        <thead>
                            <caption>Our Tacos</caption>
                            <tr>
                                <th>Tacos</th>
                                    <th scope="col"><abbr title="Quantity">Qty</abbr></th>
                                    <th scope="col">Price</th>
                                </th>
                            </tr>
                        </thead>
                        <tbody>

                            <tr>
                                <th scope="row" rowspan="3">Crunchy</th>
                                <td>1</td>
                                <td>$1.50</td>
                            </tr>

                            <tr>
                                <td>2</td>
                                <td>$2.50</td>
                            </tr>

                            <tr>
                                <td>3</td>
                                <td>$3.25</td>
                            </tr>

                            <tr>
                                <th scope="row" rowspan="3">Soft</th>
                                <td>1</td>
                                <td>$2.00</td>
                            </tr>

                            <tr>
                                <td>2</td>
                                <td>$3.50</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>$4.50</td>
                            </tr>
                            <tr>
                                <td colspan="3">Chips and Salsa $2</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                    
                  
                <br><br>
            </section>
            <br>
            <p><a href="#">Back to top</a></p>
        </main>

        <footer>Copyright &copy;The Little Taco Shop</footer>
    </div>
</body>
</html>
